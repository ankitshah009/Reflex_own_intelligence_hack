[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "ufo-ext-reflex"
version = "0.1.0"
description = "Reflex PR reviewer and observable experience capture for ufo-ai/ufo-core"
requires-python = ">=3.13"
dependencies = ["httpx>=0.28,<1", "pydantic>=2.9,<3"]

[project.entry-points."ufo.extension"]
reflex = "ufo_ext_reflex.manifest:manifest"

[project.entry-points."ufo.pack"]
reflex_demo = "ufo_ext_reflex.pack:pack"

[tool.hatch.build.targets.wheel]
packages = ["ufo_ext_reflex"]
