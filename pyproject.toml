[project]
name = "reflex-intelligence"
version = "0.1.0"
description = "Turn PR review experience into learned intelligence."
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "httpx[socks]>=0.28,<1",
  "python-dotenv>=1.1,<2",
  "river-client==0.11.0",
  "transformers>=4.57,<6",
  "huggingface-hub>=1.0,<2",
]

[dependency-groups]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
